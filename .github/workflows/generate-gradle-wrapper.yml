name: Generate gradle-wrapper.jar

on:
  workflow_dispatch:

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug: versions et node_modules
        run: |
          node -v || true
          npm -v || true
          echo "WORKDIR: $(pwd)"
          ls -la || true
          ls -la node_modules || true

      - name: Installer les dépendances npm (nécessaire : settings.gradle référence node_modules)
        run: npm ci

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Télécharger Gradle 8.6 (téléchargement direct, sans cache Actions)
        run: |
          curl -sL -o /tmp/gradle-8.6-bin.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Vérifier l'installation de Gradle
        run: gradle --version || true

      - name: Afficher android/settings.gradle (debug)
        run: |
          echo "--- android/settings.gradle ---"
          sed -n '1,200p' android/settings.gradle || true
          echo "-------------------------------"

      - name: Générer le wrapper dans android/ (avec debug)
        working-directory: android
        run: gradle wrapper --gradle-version 8.6 --stacktrace --info

      - name: Vérifier que le jar généré n'est pas vide
        working-directory: android
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          file gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/

      - name: Committer le fichier généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          git diff --cached --quiet || git commit -m "chore: génère gradle-wrapper.jar (Gradle 8.6)"
          git push