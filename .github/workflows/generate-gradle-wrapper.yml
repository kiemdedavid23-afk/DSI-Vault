name: Generate Gradle Wrapper

on:
workflow_dispatch:

permissions:
contents: write

jobs:
generate-wrapper:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Download Gradle 8.6
    run: |
      curl -fsSL \
        https://services.gradle.org/distributions/gradle-8.6-bin.zip \
        -o /tmp/gradle-8.6-bin.zip

      unzip -q /tmp/gradle-8.6-bin.zip -d /tmp

  - name: Generate Gradle Wrapper
    working-directory: android
    run: |
      /tmp/gradle-8.6/bin/gradle wrapper \
        --gradle-version 8.6 \
        --distribution-type all

  - name: Verify wrapper files
    working-directory: android
    run: |
      test -s gradle/wrapper/gradle-wrapper.jar
      test -s gradle/wrapper/gradle-wrapper.properties
      test -s gradlew
      test -s gradlew.bat

      file gradle/wrapper/gradle-wrapper.jar
      ls -lh gradle/wrapper/gradle-wrapper.jar

  - name: Commit generated wrapper
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add android/gradle/wrapper/gradle-wrapper.jar

      if git diff --cached --quiet; then
        echo "No new gradle-wrapper.jar to commit."
        exit 0
      fi

      git commit -m "chore(android): generate Gradle wrapper jar"
      git push