name: Generate gradle-wrapper.jar

# Déclenchement manuel uniquement — ce workflow ne fait pas partie du pipeline
# de build/CI de DSI Vault. Il sert uniquement à produire le binaire
# gradle-wrapper.jar que l'environnement de développement actuel ne peut pas
# générer (pas de Gradle installé, pas d'accès réseau).
#
# Gradle est téléchargé directement (curl) plutôt que via gradle/actions/setup-gradle,
# pour ne pas dépendre du service de cache GitHub Actions (indisponible au moment
# des runs précédents et responsable de l'échec).
on:
  workflow_dispatch:

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Télécharger Gradle 8.6 (téléchargement direct, sans cache Actions)
        run: |
          curl -sL -o /tmp/gradle-8.6-bin.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Vérifier l'installation de Gradle
        run: gradle --version

      - name: Générer le wrapper dans android/
        working-directory: android
        run: gradle wrapper --gradle-version 8.6

      - name: Vérifier que le jar généré n'est pas vide
        working-directory: android
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          file gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/

      - name: Committer le fichier généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          git diff --cached --quiet || git commit -m "chore: génère gradle-wrapper.jar (Gradle 8.6)"
          git push